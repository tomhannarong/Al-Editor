name: ai-editor-local

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_editor}
      POSTGRES_USER: ${POSTGRES_USER:-ai_editor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_editor_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_editor} -d ${POSTGRES_DB:-ai_editor}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
