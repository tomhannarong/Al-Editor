name: AI Editor CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'packages/**'
      - 'workers/**'
      - 'apps/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ai-editor-main-validation
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        id: install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript strict gate
        id: typecheck
        run: npm run typecheck

      - name: Vitest behavioral gate
        id: unit_tests
        run: npm test

      - name: Migration deterministic gate
        id: migration
        run: npm run migration:verify && npm run migration:test

      - name: Contract and policy gates
        id: contracts
        run: |
          npm run style:verify
          npm run style:test
          npm run jobs:test
          npm run logs:verify
          npm run logs:test
          npm run delivery:verify
          npm run delivery:test
          npm run registry:verify
          npm run registry:test
          npm run telemetry:verify
          npm run telemetry:test

      - name: Publish observable commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
        run: |
          state=success
          stage=all
          description='all validation gates passed'
          for pair in \
            "install:${INSTALL_OUTCOME}" \
            "typecheck:${TYPECHECK_OUTCOME}" \
            "unit-tests:${UNIT_TESTS_OUTCOME}" \
            "migration:${MIGRATION_OUTCOME}" \
            "contract-gates:${CONTRACTS_OUTCOME}"; do
            candidate_stage="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "$outcome" = 'failure' ]; then
              state=failure
              stage="$candidate_stage"
              description="${candidate_stage} failed"
              break
            fi
            if [ "$outcome" = 'cancelled' ]; then
              state=error
              stage="$candidate_stage"
              description="${candidate_stage} cancelled"
              break
            fi
          done

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(node -e "process.stdout.write(JSON.stringify({state:process.argv[1],context:'ai-editor-ci/'+process.argv[2],description:process.argv[3],target_url:process.argv[4]}))" "$state" "$stage" "$description" "$run_url")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
