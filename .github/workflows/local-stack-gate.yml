name: AI Editor Local Stack Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-stack-gate.yml'
  workflow_dispatch:

concurrency:
  group: ai-editor-local-stack-gate
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker runtime
        run: |
          docker version
          docker compose version

      - name: Boot and verify PostgreSQL + Qdrant
        id: stack
        run: bash infra/verify-local-stack.sh

      - name: Cleanup local stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v --remove-orphans || true

      - name: Publish observable stack status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STACK_OUTCOME: ${{ steps.stack.outcome }}
        run: |
          state=success
          context='ai-editor-local-stack/all'
          description='PostgreSQL and Qdrant runtime gate passed'
          if [ "$STACK_OUTCOME" != 'success' ]; then
            state=failure
            context='ai-editor-local-stack/runtime'
            description='PostgreSQL or Qdrant runtime gate failed'
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(node -e "process.stdout.write(JSON.stringify({state:process.argv[1],context:process.argv[2],description:process.argv[3],target_url:process.argv[4]}))" "$state" "$context" "$description" "$run_url")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
