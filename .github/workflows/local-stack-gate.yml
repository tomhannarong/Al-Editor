name: AI Editor Local Stack Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-stack-gate.yml'
      - 'infra/docker-compose.yml'
      - 'infra/verify-local-stack.sh'
      - 'infra/test-verify-local-stack.sh'
      - 'infra/verify-postgres-media-catalog-runtime.mts'
      - 'infra/verify-postgres-durable-ingest-runtime.mts'
      - 'infra/verify-postgres-scene-library-runtime.mts'
      - 'infra/verify-postgres-proxy-library-runtime.mts'
      - 'infra/verify-postgres-keyframe-library-runtime.mts'
      - 'infra/verify-postgres-transcript-library-runtime.mts'
      - 'infra/verify-postgres-editorial-segment-library-runtime.mts'
      - 'infra/verify-postgres-human-review-library-runtime.mts'
      - 'db/migrations/0008_create_human_review_library.sql'
      - 'packages/human-review-library/src/postgres.ts'
      - 'infra/verify-qdrant-indexed-scene-runtime.mts'
      - 'packages/indexed-scene-library/src/qdrant.ts'
      - 'infra/verify-real-proxy-generation-runtime.mts'
      - 'infra/verify-real-keyframe-extraction-runtime.mts'
      - 'infra/verify-real-final-delivery-runtime.mts'
      - 'apps/api/health-server.mjs'
      - 'scripts/test-api-health.mjs'
      - 'scripts/verify-api-health-runtime.sh'
  workflow_dispatch:

concurrency:
  group: ai-editor-local-stack-gate
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic verifier control flow
        run: bash infra/test-verify-local-stack.sh
      - name: Verify API health contract locally
        run: node scripts/test-api-health.mjs
      - name: Verify Docker runtime
        run: |
          docker version
          docker compose version
      - name: Boot and verify PostgreSQL + Qdrant
        id: stack
        run: bash infra/verify-local-stack.sh
      - name: Verify Qdrant REST point round-trip smoke
        id: qdrant_rest
        run: |
          set -euo pipefail
          base='http://127.0.0.1:6333'
          collection='ai_editor_qdrant_rest_smoke_v1'
          trap 'curl --fail --silent --show-error -X DELETE "${base}/collections/${collection}" >/dev/null 2>&1 || true' EXIT
          curl --fail-with-body --silent --show-error -X PUT "${base}/collections/${collection}" \
            -H 'Content-Type: application/json' \
            --data '{"vectors":{"size":4,"distance":"Cosine"}}' >/dev/null
          curl --fail-with-body --silent --show-error -X PUT "${base}/collections/${collection}/points?wait=true" \
            -H 'Content-Type: application/json' \
            --data '{"points":[{"id":1,"vector":[0.125,-0.25,0.5,1.0],"payload":{"kind":"baseline-smoke"}}]}' >/dev/null
          response=$(curl --fail-with-body --silent --show-error -X POST "${base}/collections/${collection}/points" \
            -H 'Content-Type: application/json' \
            --data '{"ids":[1],"with_payload":true,"with_vector":true}')
          node -e "const body=JSON.parse(process.argv[1]); const p=body.result?.[0]; if(!p||p.id!==1||p.payload?.kind!=='baseline-smoke'||!Array.isArray(p.vector)||p.vector.length!==4) process.exit(1)" "$response"
      - name: Install runtime verifier dependencies
        id: runtime_deps
        run: npm install --ignore-scripts --no-audit --no-fund --no-save pg tsx
      - name: Verify typed real-Qdrant indexed-scene durability
        id: qdrant_index
        run: npx --no-install tsx infra/verify-qdrant-indexed-scene-runtime.mts
      - name: Install FFmpeg runtime verifier tools
        id: ffmpeg_deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Verify PostgreSQL media, scene, derivative, transcript, editorial-segment and human-review runtime
        id: media_catalog
        run: |
          npx --no-install tsx infra/verify-postgres-media-catalog-runtime.mts
          npx --no-install tsx infra/verify-postgres-durable-ingest-runtime.mts
          npx --no-install tsx infra/verify-postgres-scene-library-runtime.mts
          npx --no-install tsx infra/verify-postgres-proxy-library-runtime.mts
          npx --no-install tsx infra/verify-postgres-keyframe-library-runtime.mts
          npx --no-install tsx infra/verify-postgres-transcript-library-runtime.mts
          npx --no-install tsx infra/verify-postgres-editorial-segment-library-runtime.mts
          npx --no-install tsx infra/verify-postgres-human-review-library-runtime.mts
      - name: Verify real FFmpeg media derivatives and final delivery
        id: derivative_generation
        run: |
          npx --no-install tsx infra/verify-real-proxy-generation-runtime.mts
          npx --no-install tsx infra/verify-real-keyframe-extraction-runtime.mts
          npx --no-install tsx infra/verify-real-final-delivery-runtime.mts
      - name: Verify API health against real local dependencies
        id: api_health
        run: bash scripts/verify-api-health-runtime.sh
      - name: Cleanup local stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v --remove-orphans || true
      - name: Publish observable stack status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STACK_OUTCOME: ${{ steps.stack.outcome }}
          QDRANT_REST_OUTCOME: ${{ steps.qdrant_rest.outcome }}
          RUNTIME_DEPS_OUTCOME: ${{ steps.runtime_deps.outcome }}
          QDRANT_INDEX_OUTCOME: ${{ steps.qdrant_index.outcome }}
          FFMPEG_DEPS_OUTCOME: ${{ steps.ffmpeg_deps.outcome }}
          MEDIA_CATALOG_OUTCOME: ${{ steps.media_catalog.outcome }}
          DERIVATIVE_GENERATION_OUTCOME: ${{ steps.derivative_generation.outcome }}
          API_HEALTH_OUTCOME: ${{ steps.api_health.outcome }}
        run: |
          state=success
          context='ai-editor-local-stack/all'
          description='PostgreSQL, Qdrant, media derivatives, final delivery and API runtime gates passed'
          if [ "$STACK_OUTCOME" != 'success' ]; then
            state=failure; context='ai-editor-local-stack/runtime'; description='PostgreSQL or Qdrant runtime gate failed'
          elif [ "$QDRANT_REST_OUTCOME" != 'success' ]; then
            state=failure; context='ai-editor-local-stack/qdrant-rest'; description='raw Qdrant REST point round-trip failed'
          elif [ "$RUNTIME_DEPS_OUTCOME" != 'success' ]; then
            state=failure; context='ai-editor-local-stack/runtime-deps'; description='runtime verifier dependency install failed'
          elif [ "$QDRANT_INDEX_OUTCOME" != 'success' ]; then
            state=failure; context='ai-editor-local-stack/qdrant-index'; description='typed Qdrant indexed-scene durability gate failed'
          elif [ "$FFMPEG_DEPS_OUTCOME" != 'success' ]; then
            state=failure; context='ai-editor-local-stack/ffmpeg-deps'; description='FFmpeg runtime verifier tool install failed'
          elif [ "$MEDIA_CATALOG_OUTCOME" != 'success' ]; then
            state=failure; context='ai-editor-local-stack/media-catalog'; description='PostgreSQL media, scene, derivative, transcript, editorial-segment or human-review persistence gate failed'
          elif [ "$DERIVATIVE_GENERATION_OUTCOME" != 'success' ]; then
            state=failure; context='ai-editor-local-stack/derivative-generation'; description='real FFmpeg derivative or final-delivery gate failed'
          elif [ "$API_HEALTH_OUTCOME" != 'success' ]; then
            state=failure; context='ai-editor-local-stack/api-health'; description='API dependency health runtime gate failed'
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(node -e "process.stdout.write(JSON.stringify({state:process.argv[1],context:process.argv[2],description:process.argv[3],target_url:process.argv[4]}))" "$state" "$context" "$description" "$run_url")
          curl --fail-with-body --silent --show-error --request POST --header "Authorization: Bearer ${GH_TOKEN}" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --data "$payload"
