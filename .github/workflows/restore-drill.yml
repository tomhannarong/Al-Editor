name: AI Editor Restore Drill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-drill.yml'
      - 'infra/verify-backup-restore-runtime.sh'
      - 'infra/docker-compose.yml'
      - 'packages/contracts/src/backup-restore-policy.contract.ts'
      - 'packages/contracts/src/backup-restore-policy.contract.test.ts'
  workflow_dispatch:

concurrency:
  group: ai-editor-restore-drill
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Docker runtime
        run: |
          docker version
          docker compose version
      - name: Boot PostgreSQL + Qdrant
        id: stack
        run: bash infra/verify-local-stack.sh
      - name: Execute clean-target backup/restore drill
        id: restore
        run: bash infra/verify-backup-restore-runtime.sh
      - name: Cleanup local stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v --remove-orphans || true
      - name: Publish observable restore status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STACK_OUTCOME: ${{ steps.stack.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
        run: |
          state=success
          context='ai-editor-restore/all'
          description='PostgreSQL and Qdrant clean-target restore drill passed'
          if [ "$STACK_OUTCOME" != 'success' ]; then
            state=failure; context='ai-editor-restore/runtime'; description='restore drill dependency stack failed'
          elif [ "$RESTORE_OUTCOME" != 'success' ]; then
            state=failure; context='ai-editor-restore/drill'; description='clean-target restore drill failed'
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(node -e "process.stdout.write(JSON.stringify({state:process.argv[1],context:process.argv[2],description:process.argv[3],target_url:process.argv[4]}))" "$state" "$context" "$description" "$run_url")
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
